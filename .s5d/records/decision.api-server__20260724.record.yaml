decision:
  title: Hummingbird 2 in-process server
  winner_id: hummingbird
  rejected_ids:
  - network-framework
  - vapor
  - cli-subprocess
  context: Need LM Studio-style OpenAI-compatible API over the existing Swift runtime; single warm model, serialized generations
  decision: Build TurboFieldfareServer as a new SPM executable on Hummingbird 2, in-process over the TurboFieldfare library
  rationale: 'Best correctness-per-dependency: async/await-native SSE and routing without owning an HTTP stack; Vapor too heavy, hand-rolled too risky, subprocess cannot stay warm'
  consequences: Adds hummingbird+swift-nio dependency tree to Package.swift; HTTP layer is framework code, generation stays library code
  decided_at: 2026-07-24T08:03:26.911851+00:00
  confirmed_by: Roman
  expires_at: 2026-10-22
  do_list: []
  dont_list: []
  challenge:
    mode: standard
    passed: true
    summary: '5 probes run: (1) counter-argument zero-dep rejected — HTTP framing bugs cost more than one dependency; (2) tail failure — client disconnect mid-decode must cancel via Task.checkCancellation, verified present in runRawCompletion; (3) evidence weakness — Hummingbird API details from knowledge, to be verified against Package.resolved at implementation; (4) weakest link — single-in-flight serialization caps throughput at 1 generation, acceptable for local LM Studio-style serving; (5) existing alternatives — llama.cpp/mlx-lm servers exist but forfeit the 2GB streaming runtime, which is the point of the fork'
    checks: []
