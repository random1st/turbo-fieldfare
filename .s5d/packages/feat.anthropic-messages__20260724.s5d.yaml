context: |
  ## Problem

  TurboFieldfareServer speaks only the OpenAI schema. Clients built on the
  Anthropic SDK — or any tool expecting `POST /v1/messages` (Anthropic
  Messages API) — cannot use the server, even though the underlying
  generation capabilities are identical.

  ## Goal

  Add `POST /v1/messages` to the existing TurboFieldfareServer: Anthropic
  Messages request/response schema, SSE event protocol for `stream: true`
  (`message_start`, `content_block_start`, `content_block_delta`,
  `content_block_stop`, `message_delta`, `message_stop`), and Anthropic-style
  error bodies. Pure protocol translation inside the existing serving domain —
  `GenerationSession`, the FIFO single-in-flight slot, sampling validation,
  and the runtime stay untouched.

  ## Privacy
  Classification: Internal
workflow:
  mode: plan
  target_architecture:
    summary: |
      The serving domain gains a second protocol adapter beside the OpenAI
      one, inside the same TurboFieldfareServerCore library. Anthropic Codable
      types live in a new AnthropicTypes.swift; Routes.swift gains the
      /v1/messages handler reusing the same GenerationSession. System-prompt
      handling maps Anthropic `system` (string or text blocks) onto the
      runtime's native system role; user/assistant roles map one-to-one.
      Stop reasons map endOfTurn/eos/stopString → end_turn (or stop_sequence
      when a client stop string fired) and maxTokens → max_tokens.
    invariants:
    - One warm model per server process; model loads at startup, never per request
    - At most one generation in flight; requests queue FIFO (shared with OpenAI routes)
    - Client disconnect cancels the in-flight generation via Task cancellation
    - Server target adds no runtime logic; only protocol translation
  delivery_strategy:
    summary: |
      Single brick: AnthropicTypes.swift + one route handler + SSE event
      framing in Core, tests in Tests/TurboFieldfareServer. No new targets,
      no new dependencies, no changes to existing OpenAI handlers.
    rationale: |
      Additive-only change keeps the fork trivially rebaseable onto upstream
      and mirrors decision.api-server (Hummingbird 2, confirmed by Roman
      2026-07-24) — no new serving tradeoff is being decided.
