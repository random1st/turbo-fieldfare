    rollback:
    - Discard spike output if assumptions fail
  - id: build
    title: Build
    scope: Implement approved scope and pass local gates
    roles:
    - implementer
    - reviewer
    acceptance:
    - Declared gates pass
    - Change matches approved scope
    rollback:
    - Revert or reconcile if gates or review fail
  - id: measure
    title: Measure
    scope: Collect telemetry and close the loop with an explicit verdict
    roles:
    - owner
    - verifier
    acceptance:
    - Smoke against the real model — stream=false returns Anthropic message shape with usage
    - stream=true emits the full event sequence in order and ends with message_stop
    - Missing max_tokens yields 400 invalid_request_error
    rollback:
    - Iterate or kill if evidence stays weak
