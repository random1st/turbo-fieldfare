context: |
  ## Problem

  TurboFieldfare has no network API. Its unique value — Gemma 4 26B-A4B running
  in ~2 GB RAM via SSD expert streaming — is reachable only from the CLI, the
  Mac app, or the internal Unix-socket IPC. No existing tool (OpenAI SDK,
  Continue, aichat, scripts) can talk to it.

  ## Goal

  A new SPM executable `TurboFieldfareServer` that loads the model once and
  serves an LM Studio-style OpenAI-compatible HTTP API on localhost:
  `GET /v1/models`, `POST /v1/chat/completions` (SSE streaming + non-streaming),
  `POST /v1/completions`, `GET /health`. HTTP layer is Hummingbird 2 per
  decision.api-server (confirmed by Roman 2026-07-24).

  ## Privacy
  Classification: Internal — localhost-only by default, no telemetry, prompts
  never leave the process.
workflow:
  mode: plan
  target_architecture:
    summary: |
      A serving domain sits beside frontend and install. TurboFieldfareServerCore (library target, testable) owns HTTP routing, OpenAI schema codable types, SSE framing, and a GenerationSession actor that serializes access to the single warm RealForwardRunner per the library single-in-flight contract. The Command executable is a thin arg-parsing shell, mirroring the existing TurboFieldfareCLI Core/Command split. Generation itself stays in the TurboFieldfare library; the server never reimplements runtime logic.
    invariants:
    - One warm model per server process; model loads at startup, never per request
    - At most one generation in flight; requests queue FIFO
    - Client disconnect cancels the in-flight generation via Task cancellation
    - Server target adds no runtime logic; only protocol translation
  delivery_strategy:
    summary: |
      Single brick: add Sources/TurboFieldfareServer/{Core,Command}, wire Package.swift product+dependency on hummingbird, add Tests/TurboFieldfareServer. No changes to existing targets.
    rationale: |
      Additive-only change keeps the fork trivially rebaseable onto upstream.
  resources: null
  role_map:
    implementer: coder
    verifier: reviewer
    owner: human
    reviewer: reviewer
  review_policy:
    cross_model_required: false
    required_on: []
  structure_outline:
    summary: |
      OpenAI Codable types + Hummingbird router + GenerationSession actor + SSE writer in Core; ArgumentParser-free hand-rolled flags in Command (matches repo CLI style).
    signatures:
    - actor GenerationSession { func chat(messages:config:) -> AsyncThrowingStream<TokenDelta,Error> }
    - 'struct ChatCompletionRequest: Decodable'
    - 'func routes(session: GenerationSession) -> some RouterProtocol'
    - 'func writeSSE(chunk: Encodable) -> ByteBuffer'
    types:
    - ChatCompletionRequest / ChatCompletionResponse / ChatCompletionChunk
    - CompletionRequest / CompletionResponse
    - ModelList / ModelCard
    - GenerationSession (actor)
  execution_mode:
    engine: manual
    max_iterations: null
    stop_conditions:
    - Phase acceptance reached
    - Approved scope exhausted
    - New decision required
  phases:
  - id: build
    title: Build
    scope: Implement approved scope and pass local gates
    roles:
    - implementer
    - reviewer
    acceptance:
    - Declared gates pass
    - Change matches approved scope
    rollback:
    - Revert or reconcile if gates or review fail
  - id: measure
    title: Measure
    scope: Live smoke test against a real installed .gturbo model
    roles:
    - owner
    - verifier
    acceptance:
    - curl stream=true shows incremental SSE chunks
    - disconnect cancels decode, next request served without reload
    rollback:
    - Iterate or kill if evidence stays weak
