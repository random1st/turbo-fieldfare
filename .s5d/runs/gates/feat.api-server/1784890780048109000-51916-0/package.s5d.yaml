hypotheses:
- id: shared-session-actor
  title: Single GenerationSession actor
  content: One actor owns runner+scratch; all requests enqueue FIFO. Matches library single-in-flight contract; simplest correct concurrency.
  scope: server concurrency
  kind: system
  layer: L1
  r_eff: null
  evidence:
  - id: 20260724-internal-shared-session-actor
    type: internal
    content: RawCompletionScratch docstring states single-in-flight guard upstream is the contract; actor is that guard. Zero extra RAM.
    verdict: pass
    valid_until: 2026-10-22T08:11:45.183430+00:00
    carrier_ref: null
    formality: 4
