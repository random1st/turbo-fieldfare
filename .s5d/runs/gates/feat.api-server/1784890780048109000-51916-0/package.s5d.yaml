  spec_ref: null
  prompt: null
  next_move: null
- id: per-request-runner
  title: Per-request runner pool
  content: Pool of N RealForwardRunner+scratch instances for parallel generations. Costs N x KV cache and expert-cache RAM; violates the 2GB budget on target hardware.
  scope: server concurrency
  kind: system
  layer: invalid
  r_eff: null
  evidence:
  - id: 20260724-internal-per-request-runner
    type: internal
    content: Each runner adds FP16 KV cache (4K context) plus expert cache slots; on the 8GB target a second runner breaks the memory budget the project exists for.
    verdict: fail
    valid_until: 2026-10-22T08:11:45.197404+00:00
