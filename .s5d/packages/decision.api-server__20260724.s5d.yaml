problem:
  signal: 'TurboFieldfare has no network API: only CLI, Mac app, and internal Unix-socket IPC. LM Studio-style local serving needs an OpenAI-compatible HTTP endpoint so existing tools can talk to the 2GB-RAM Gemma 4 runtime.'
  constraints:
  - single warm model load
  - serialized generations (single-in-flight contract)
  - minimal new dependencies
  targets:
  - OpenAI schema fidelity
  - SSE token streaming
  - cancel on disconnect
  indicators: []
  goodhart_guard: null
  acceptance: POST /v1/chat/completions with stream=true yields incremental SSE chunks in OpenAI schema; GET /v1/models lists the served model; client disconnect cancels decode and server serves next request without reload
  blast_radius: null
  reversibility: null
  status: backlog
hypotheses:
- id: hummingbird
  title: Hummingbird 2 in-process server
  content: New SPM executable target TurboFieldfareServer depending on Hummingbird 2 (swift-nio). Loads model once, serializes generations via actor, serves /v1/chat/completions with SSE streaming, /v1/completions, /v1/models.
  scope: serving domain, new component
  kind: system
  layer: L1
  r_eff: null
  evidence:
  - id: 20260724-internal-hummingbird
    type: internal
    content: Async/await-native, SSE via streamed response body, dependency footprint is hummingbird plus swift-nio only. Widely used for exactly this shape of API.
