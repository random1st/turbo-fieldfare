contracts:
- id: contract.anthropic-messages
  format: openapi
  path: null
  sha256: null
  inline: |
    openapi: 3.0.3
    info: {title: TurboFieldfare Anthropic-compatible Messages API, version: 0.1.0}
    paths:
      /v1/messages:
        post:
          summary: Create a message (Anthropic Messages API subset)
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [model, max_tokens, messages]
                  properties:
                    model: {type: string}
                    max_tokens: {type: integer, minimum: 1}
                    messages:
                      type: array
                      items:
                        type: object
                        required: [role, content]
                        properties:
                          role: {type: string, enum: [user, assistant]}
                          content:
                            oneOf:
                            - type: string
                            - type: array
                              items: {type: object, properties: {type: {enum: [text]}, text: {type: string}}}
                    system:
                      oneOf:
                      - type: string
                      - type: array
                        items: {type: object, properties: {type: {enum: [text]}, text: {type: string}}}
                    temperature: {type: number, minimum: 0}
                    top_p: {type: number, exclusiveMinimum: 0, maximum: 1}
                    stop_sequences: {type: array, items: {type: string}}
                    stream: {type: boolean, default: false}
          responses:
            '200':
              description: |
                Non-stream: {id: msg_*, type: message, role: assistant,
                content: [{type: text, text}], model, stop_reason, usage:
                {input_tokens, output_tokens}}.
                Stream: SSE events message_start, content_block_start,
                content_block_delta (text_delta), content_block_stop,
                message_delta (stop_reason + usage), message_stop.
            '400':
              description: '{type: error, error: {type: invalid_request_error, message}}'
  binds_to:
  - capability: cap.anthropic-messages
    entity: null
